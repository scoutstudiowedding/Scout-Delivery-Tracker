<style id="scout-patch-style">
/* Make kanban horizontally scrollable */
.flex.gap-3.overflow-x-auto {
  display: flex !important;
  flex-wrap: nowrap !important;
  overflow-x: auto !important;
  overflow-y: hidden !important;
  gap: 12px !important;
  padding-bottom: 16px !important;
  scroll-behavior: smooth !important;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: #d4d4d8 #f4f4f5;
}
.flex.gap-3.overflow-x-auto::-webkit-scrollbar {
  height: 10px;
  display: block !important;
}
.flex.gap-3.overflow-x-auto::-webkit-scrollbar-track {
  background: #f4f4f5;
  border-radius: 999px;
}
.flex.gap-3.overflow-x-auto::-webkit-scrollbar-thumb {
  background: #d4d4d8;
  border-radius: 999px;
  border: 2px solid #f4f4f5;
}
.flex.gap-3.overflow-x-auto::-webkit-scrollbar-thumb:hover {
  background: #a1a1aa;
}
.kanban-col-hidden {
  display: none !important;
}
#scout-kanban-wrapper {
  position: relative;
}
#scout-kanban-controls {
  position: sticky;
  top: 0;
  z-index: 5;
  margin-bottom: 12px;
  background: white;
  border: 1px solid #e4e4e7;
  border-radius: 12px;
  padding: 10px 12px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.05);
}
#scout-scroll-btns {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  background: #fafafa;
  border: 1px solid #e4e4e7;
  border-radius: 9999px;
  padding: 4px 4px 4px 10px;
}
</style>

<script id="scout-patch-script">
(function() {
  const COLUMNS = ["Backlog","Photo Editing","Video Editing","Album Production","Frame Production","Pendrive","Delivered"];
  let hiddenCols = new Set(JSON.parse(localStorage.getItem('scout_hidden_cols') || '[]'));
  let hideEmptyEnabled = localStorage.getItem('scout_hide_empty') === 'true';

  function saveState() {
    localStorage.setItem('scout_hidden_cols', JSON.stringify([...hiddenCols]));
    localStorage.setItem('scout_hide_empty', hideEmptyEnabled ? 'true' : 'false');
  }

  function getKanbanContainer() {
    const candidates = document.querySelectorAll('div.flex.gap-3.overflow-x-auto');
    for (let c of candidates) {
      if (c.classList.contains('snap-x')) return c;
    }
    return document.querySelector('div.flex.gap-3.overflow-x-auto');
  }

  function updateVisibility() {
    const container = getKanbanContainer();
    if (!container) return;
    const cols = Array.from(container.children);
    cols.forEach(col => {
      let label = '';
      const labelEl = col.querySelector('span.mono.tracking-widest');
      if (labelEl) label = labelEl.textContent.trim();
      if (!label) {
        for (let c of COLUMNS) {
          if (col.textContent.toLowerCase().includes(c.toLowerCase())) { label = c; break; }
        }
      }
      let matched = COLUMNS.find(c => label.toLowerCase().includes(c.toLowerCase()) || c.toLowerCase().includes(label.toLowerCase())) || label;
      if (!COLUMNS.includes(matched)) return;

      let isHidden = hiddenCols.has(matched);
      if (!isHidden && hideEmptyEnabled) {
        const badge = col.querySelector('span.mono.px-2.py-0\.5');
        if (badge) {
          const n = parseInt(badge.textContent.trim());
          if (!isNaN(n) && n === 0) isHidden = true;
        }
      }
      if (isHidden) col.classList.add('kanban-col-hidden');
      else col.classList.remove('kanban-col-hidden');
    });
    
    const pill = document.getElementById('scout-hidden-count');
    if (pill) {
      const totalHidden = document.querySelectorAll('.kanban-col-hidden').length;
      if (totalHidden > 0) {
        pill.textContent = totalHidden + ' hidden';
        pill.parentElement.style.display = 'flex';
      } else {
        pill.parentElement.style.display = 'none';
      }
    }
  }

  function createControls() {
    if (document.getElementById('scout-kanban-controls')) return;
    const container = getKanbanContainer();
    if (!container) return;

    // Wrap kanban in relative wrapper if not already
    let wrapper = document.getElementById('scout-kanban-wrapper');
    if (!wrapper) {
      wrapper = document.createElement('div');
      wrapper.id = 'scout-kanban-wrapper';
      container.parentNode.insertBefore(wrapper, container);
      wrapper.appendChild(container);
    }

    const controls = document.createElement('div');
    controls.id = 'scout-kanban-controls';
    controls.innerHTML = `
      <div class="flex items-center gap-2 text-[11px] mono font-medium text-zinc-700">
        <span>👁️ Columns:</span>
      </div>
      <div id="scout-col-checkboxes" class="flex flex-wrap gap-1.5"></div>
      <div class="flex items-center gap-2 ml-2">
        <button id="scout-hide-empty" class="h-7 px-3 rounded-full border text-[11px] mono ${hideEmptyEnabled ? 'bg-amber-500 text-white border-amber-500' : 'bg-white border-zinc-200 text-zinc-600'}">Hide Empty</button>
        <button id="scout-show-all" class="h-7 px-3 rounded-full bg-zinc-900 text-white text-[11px] mono">Show All</button>
        <span id="scout-hidden-pill" style="display:none" class="flex items-center gap-1 text-[11px] mono"><span class="px-2 py-0.5 rounded-full bg-amber-50 border border-amber-200 text-amber-800"><span id="scout-hidden-count">0 hidden</span></span></span>
      </div>
      <div id="scout-scroll-btns">
        <span class="text-[10px] mono text-zinc-500 font-medium">SCROLL KANBAN</span>
        <button id="scout-scroll-left" title="Scroll left" class="h-8 w-8 rounded-full bg-zinc-900 text-white grid place-items-center hover:bg-black transition text-[14px] font-bold">←</button>
        <button id="scout-scroll-right" title="Scroll right" class="h-8 w-8 rounded-full bg-zinc-900 text-white grid place-items-center hover:bg-black transition text-[14px] font-bold">→</button>
      </div>
    `;

    wrapper.parentNode.insertBefore(controls, wrapper);

    // Checkboxes
    const checkboxContainer = controls.querySelector('#scout-col-checkboxes');
    COLUMNS.forEach(colName => {
      const label = document.createElement('label');
      const isChecked = !hiddenCols.has(colName);
      label.className = 'flex items-center gap-1 h-7 px-2.5 rounded-full border cursor-pointer text-[11px] mono transition ' + (isChecked ? 'bg-white border-zinc-200 text-zinc-700' : 'bg-zinc-100 border-zinc-200 text-zinc-400 opacity-60');
      label.innerHTML = `<input type="checkbox" ${isChecked ? 'checked' : ''} data-col="${colName}" class="h-3 w-3"> ${colName}`;
      checkboxContainer.appendChild(label);
      
      label.querySelector('input').addEventListener('change', (e) => {
        if (e.target.checked) hiddenCols.delete(colName);
        else hiddenCols.add(colName);
        saveState();
        label.className = 'flex items-center gap-1 h-7 px-2.5 rounded-full border cursor-pointer text-[11px] mono transition ' + (e.target.checked ? 'bg-white border-zinc-200 text-zinc-700' : 'bg-zinc-100 border-zinc-200 text-zinc-400 opacity-60');
        updateVisibility();
      });
    });

    controls.querySelector('#scout-hide-empty').addEventListener('click', function() {
      hideEmptyEnabled = !hideEmptyEnabled;
      saveState();
      this.className = `h-7 px-3 rounded-full border text-[11px] mono ${hideEmptyEnabled ? 'bg-amber-500 text-white border-amber-500' : 'bg-white border-zinc-200 text-zinc-600'}`;
      updateVisibility();
    });

    controls.querySelector('#scout-show-all').addEventListener('click', () => {
      hiddenCols.clear();
      hideEmptyEnabled = false;
      saveState();
      checkboxContainer.querySelectorAll('input').forEach(inp => {
        inp.checked = true;
        inp.parentElement.className = 'flex items-center gap-1 h-7 px-2.5 rounded-full border cursor-pointer text-[11px] mono transition bg-white border-zinc-200 text-zinc-700';
      });
      controls.querySelector('#scout-hide-empty').className = 'h-7 px-3 rounded-full border text-[11px] mono bg-white border-zinc-200 text-zinc-600';
      updateVisibility();
    });

    // Scroll buttons - THE KEY PART
    const scrollLeftBtn = controls.querySelector('#scout-scroll-left');
    const scrollRightBtn = controls.querySelector('#scout-scroll-right');
    
    scrollLeftBtn.addEventListener('click', () => {
      container.scrollBy({left: -400, behavior: 'smooth'});
    });
    scrollRightBtn.addEventListener('click', () => {
      container.scrollBy({left: 400, behavior: 'smooth'});
    });

    // Floating buttons removed - only top buttons kept
  }

  function addHeaderHideButtons() {
    const container = getKanbanContainer();
    if (!container) return;
    Array.from(container.children).forEach(col => {
      if (col.querySelector('.scout-hide-col-btn')) return;
      const header = col.querySelector('div.sticky');
      if (!header) return;
      const btn = document.createElement('button');
      btn.className = 'scout-hide-col-btn ml-auto h-5 w-5 rounded-full bg-white border border-zinc-200 grid place-items-center text-[10px] text-zinc-500 hover:bg-zinc-100';
      btn.textContent = '×';
      btn.title = 'Hide this column';
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        let label = '';
        const labelEl = col.querySelector('span.mono.tracking-widest');
        if (labelEl) label = labelEl.textContent.trim();
        if (!label) {
          for (let c of COLUMNS) {
            if (col.textContent.toLowerCase().includes(c.toLowerCase())) { label = c; break; }
          }
        }
        let matched = COLUMNS.find(c => label.toLowerCase().includes(c.toLowerCase()) || c.toLowerCase().includes(label.toLowerCase())) || label;
        if (COLUMNS.includes(matched)) {
          hiddenCols.add(matched);
          saveState();
          const cb = document.querySelector(`input[data-col="${matched}"]`);
          if (cb) {
            cb.checked = false;
            cb.parentElement.className = 'flex items-center gap-1 h-7 px-2.5 rounded-full border cursor-pointer text-[11px] mono transition bg-zinc-100 border-zinc-200 text-zinc-400 opacity-60';
          }
          updateVisibility();
        }
      });
      header.appendChild(btn);
    });
  }

  let attempts = 0;
  const initInterval = setInterval(() => {
    attempts++;
    const container = getKanbanContainer();
    if (container) {
      container.style.display = 'flex';
      container.style.flexWrap = 'nowrap';
      container.style.overflowX = 'auto';
      container.style.gap = '12px';
      container.style.paddingBottom = '16px';
      Array.from(container.children).forEach(col => {
        col.style.minWidth = '340px';
        col.style.width = '360px';
        col.style.flexShrink = '0';
      });
      
      createControls();
      addHeaderHideButtons();
      updateVisibility();
      
      if (attempts > 5) {
        clearInterval(initInterval);
        const observer = new MutationObserver(() => {
          const cont = getKanbanContainer();
          if (cont) {
            Array.from(cont.children).forEach(col => {
              if (!col.style.minWidth || col.style.minWidth === '0px' || col.style.minWidth === '') {
                col.style.minWidth = '340px';
                col.style.width = '360px';
                col.style.flexShrink = '0';
              }
            });
            addHeaderHideButtons();
          }
        });
        observer.observe(document.body, {childList: true, subtree: true});
      }
    }
    if (attempts > 50) clearInterval(initInterval);
  }, 400);

  setInterval(updateVisibility, 2000);
})();
</script>
